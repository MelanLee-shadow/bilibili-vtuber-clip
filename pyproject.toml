[tool.ruff]
# The dedicated speaker/diarization runtime on free is Python 3.11.
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Runtime entry points deliberately adjust sys.path before importing the
# project package. Keep that compatibility seam, but lint every other error.
"scripts/*.py" = ["E402"]
# These three thin compatibility facades re-export extracted runtime symbols
# so old callers and monkeypatch seams keep working.
"scripts/free_session_autoslice.py" = ["F401"]
"scripts/produce_slice_package.py" = ["F401"]
"scripts/run_auto_review_shadow_pipeline.py" = ["F401"]
