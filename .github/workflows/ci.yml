name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System deps (ffmpeg for media tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install torch CPU wheel first (keeps CI off the CUDA bundle)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Runtime GC with complete Linux process visibility
        run: |
          gc_test_root="$(mktemp -d "${RUNNER_TEMP}/runtime-gc-root.XXXXXX")"
          trap 'sudo rm -rf -- "$gc_test_root"' EXIT
          sudo env PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" -m pytest -q \
            -p no:cacheprovider --basetemp "$gc_test_root" \
            tests/test_runtime_gc.py tests/test_terminal_out_gc.py
      - name: Test suite (hermetic — no credentials, no network)
        run: python -m pytest -q
